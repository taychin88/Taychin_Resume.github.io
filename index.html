<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taychin Pratuengsukpong – Engineering Intern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09071a;--card:#1a1629;--line:rgba(255,255,255,.1);--fg:#fff;--mut:#b3aecb;--pu:#a855f7;--bl:#60a5fa;--pk:#f472b6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 Inter,Arial,sans-serif;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--bl);outline-offset:3px;border-radius:10px}
h1,h2,h3,.sg{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
#glow{position:fixed;width:520px;height:520px;left:0;top:0;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.28),transparent 65%);pointer-events:none;z-index:0;will-change:transform}
.bgo{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none;animation:fl 14s ease-in-out infinite alternate}
.bgo.a{width:380px;height:380px;background:#4c2a96;left:-80px;top:8%}
.bgo.b{width:320px;height:320px;background:#1d4ed8;right:-60px;bottom:6%;animation-delay:-6s;opacity:.35}
@keyframes fl{to{transform:translate(90px,60px)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:74px;gap:14px}
.logo{font:400 28px "DM Serif Display",Georgia,serif;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--pu),var(--bl));box-shadow:0 0 14px var(--pu)}
nav ul{display:flex;gap:4px;margin:0;padding:0;list-style:none;overflow-x:auto}
nav li a{display:block;padding:9px 16px;border:1px dashed transparent;border-radius:12px;text-decoration:none;font-weight:500;white-space:nowrap;transition:.2s}
nav li a:hover{color:var(--bl);background:rgba(96,165,250,.08)}
nav li a.on{border-color:var(--pu);color:var(--bl)}
#cur{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,#6d28d9,#2563eb 55%,#db2777);transform:translateY(100%);pointer-events:none;display:flex;align-items:center;justify-content:center;font:400 clamp(40px,10vw,120px) "DM Serif Display",Georgia,serif;letter-spacing:-.03em}
#cur.in{transition:transform .4s cubic-bezier(.7,0,.2,1);transform:translateY(0)}
#cur.out{transition:transform .5s cubic-bezier(.7,0,.2,1);transform:translateY(-100%)}
main{position:relative;z-index:1;min-height:80vh}
.pg>*{animation:up .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;padding:70px 0 40px}
.badge{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,#3b2468,#201a3d);color:#d6c7ff;border-radius:16px;padding:12px 26px;font-weight:700;font-size:14px;letter-spacing:.04em}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--bl);box-shadow:0 0 10px var(--bl);animation:bk 1.4s infinite}
@keyframes bk{50%{opacity:.3}}
.shim{background:linear-gradient(90deg,#fff,#c4b5fd 22%,#60a5fa 42%,#f9a8d4 62%,#fff 80%,#c4b5fd);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.hero h1 em{display:block;font-style:italic;background:linear-gradient(90deg,var(--bl),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}
.hero h1 span.shim{display:block}
.hero h1{font-size:clamp(44px,6.2vw,84px);line-height:1.02;letter-spacing:-.02em;margin:28px 0 18px;font-weight:400}
.nm{font:400 clamp(30px,4.6vw,56px)/1.05 "DM Serif Display",Georgia,serif;margin-bottom:10px}.nm em{font-style:italic;background:linear-gradient(90deg,var(--bl),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}
.tw{font:500 clamp(16px,2vw,21px) Inter,sans-serif;color:var(--bl);min-height:1.6em}
.tw:after{content:"▌";animation:bk 1s steps(2) infinite;margin-left:2px}
.hero p.ab{color:var(--mut);font-size:19px;max-width:58ch;margin:18px 0 34px}
.btns{display:flex;gap:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#1b1830;border-radius:14px;padding:15px 26px;font-size:18px;font-weight:500;text-decoration:none;display:inline-block;position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
.btn:hover{border-color:var(--pu);transform:translateY(-3px)}
.btn.p{background:linear-gradient(90deg,#7c3aed,#2563eb);border-color:transparent}
.pw{position:relative;perspective:900px}
.pc{position:relative;aspect-ratio:.82;border-radius:36px;border:1px solid var(--line);overflow:hidden;background:#15112a;transition:transform .15s;transform-style:preserve-3d}
.pc img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.pc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(9,7,26,.92))}
.pc div{position:absolute;left:26px;bottom:24px;z-index:2}
.pc b{display:block;font:400 26px "DM Serif Display",Georgia,serif}
.pc span{color:#d8d3ea}
.fc{position:absolute;z-index:3;background:rgba(20,16,40,.85);backdrop-filter:blur(8px);border:1px solid rgba(168,85,247,.6);border-radius:14px;padding:8px 16px;font:700 14px Inter,sans-serif;animation:fl2 4s ease-in-out infinite alternate;box-shadow:0 0 22px rgba(168,85,247,.35)}
@keyframes fl2{to{transform:translateY(-14px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0 0}
.st{padding:22px 24px}
.st b{display:block;font:400 clamp(34px,4.6vw,56px)/1 "DM Serif Display",Georgia,serif;background:linear-gradient(90deg,var(--pu),var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
.st span{color:var(--mut);font-size:15px}
.ex{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 70px}
.ex a{text-decoration:none;padding:26px;display:flex;justify-content:space-between;align-items:center;font:400 24px "DM Serif Display",Georgia,serif}
.ex a span{font-size:28px;transition:transform .2s;color:var(--pu)}
.ex a:hover span{transform:translate(6px,-6px)}
.c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;transition:border-color .2s,box-shadow .2s,transform .2s;overflow:hidden}
.c:before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(168,85,247,.22),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
.c:hover{border-color:#c026d3;box-shadow:0 0 26px rgba(192,38,211,.35)}
.c:hover:before{opacity:1}
.ph{padding:64px 0 34px}
.ph h2{font-size:clamp(46px,7vw,88px);letter-spacing:-.02em;line-height:1}
.ph p{color:var(--mut);margin:10px 0 0;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 28px}
.chip{background:#1b1830;border:1px solid var(--line);border-radius:99px;padding:8px 20px;font-weight:500;transition:.2s}
.chip:hover{border-color:var(--pu)}
.chip[aria-pressed=true]{background:linear-gradient(90deg,#7c3aed,#2563eb);border-color:transparent}
.sg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.sk{padding:22px;display:flex;flex-direction:column;gap:14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.sk:hover{transform:translateY(-6px)}
.tl{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font:400 20px "DM Serif Display",Georgia,serif;color:var(--c);background:var(--b);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);transition:transform .3s}
.sk:hover .tl{transform:rotate(-8deg) scale(1.12)}
.sk h3{font-size:20px}
.sk small{color:var(--mut);display:block;font-size:14px}
.soft{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:14px 0 80px}
.soft .c{padding:22px}
.soft h3{font-size:20px;margin-bottom:8px}
.soft p{margin:0;color:var(--mut);font-size:15px}
.yr{font:700 15px Inter,sans-serif;color:var(--pu)}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg span{border:1px solid rgba(168,85,247,.5);background:rgba(168,85,247,.12);color:#dcc9ff;border-radius:99px;padding:3px 14px;font:500 13px Inter,sans-serif}
@keyframes dr{from{transform:scaleY(0)}}
.gp{display:inline-block;margin-top:12px;padding:4px 16px;border-radius:99px;background:rgba(96,165,250,.14);color:var(--bl);font:700 15px Inter,sans-serif}
.cta{padding:clamp(28px,5vw,60px);background:linear-gradient(135deg,#2a1d4d,#161230);margin-bottom:90px}
.cta h2{font-size:clamp(32px,5vw,60px);max-width:16ch;line-height:1.05;letter-spacing:-.03em}
.cl{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.cl .c{padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.cl small{display:block;color:var(--mut);font-size:14px}
.cl b{font:400 clamp(17px,2vw,22px) "DM Serif Display",Georgia,serif;overflow-wrap:anywhere}
.cp{border:1px solid var(--line);background:#120f24;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;transition:.2s;white-space:nowrap}
.cp:hover{background:var(--pu);border-color:var(--pu)}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#fff;color:#000;font-weight:700;padding:12px 22px;border-radius:99px;z-index:60;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
#toast.s{transform:translate(-50%,0)}
footer{position:relative;z-index:1;border-top:1px solid var(--line);background:#000;padding:26px 0 30px;color:var(--mut);font-size:15px}
footer .wrap{display:flex;align-items:center;gap:18px}
footer img{height:46px;width:auto}
.tlw{position:relative;padding-left:46px;margin-bottom:90px}
.tlw:before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--bl),var(--pu),transparent);transform-origin:top;animation:dr 1.3s ease-out both}
@keyframes dr{from{transform:scaleY(0)}}
.ti{position:relative;margin-bottom:22px}
.ti:before{content:"";position:absolute;left:-38px;top:34px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid #5b5675;transition:.3s;z-index:2}
.ti.now:before{border-color:var(--bl);box-shadow:0 0 16px var(--bl)}
.ti.o:before{border-color:var(--pu);background:var(--pu);box-shadow:0 0 16px var(--pu)}
.ah{display:flex;width:100%;align-items:center;gap:20px;text-align:left;background:none;border:0;padding:26px 28px}
.ah .t{flex:1}
.ah .yr{display:block;margin-bottom:6px}
.ah h3{font-size:clamp(22px,2.8vw,32px);line-height:1.15}
.ah small{color:var(--mut);display:block;margin-top:8px;font-size:15px}
.ah img{height:58px;width:auto}
.mn{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#3b2468,#1d3a8a);font:400 24px "DM Serif Display",Georgia,serif}
.pm{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:26px;line-height:1;transition:transform .35s,background .2s;flex:none}
.o .pm{transform:rotate(45deg);background:var(--pu);border-color:var(--pu)}
.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.o .ab{grid-template-rows:1fr}
.in{overflow:hidden;min-height:0}
.in>div{margin:0 28px;padding:22px 0 28px;border-top:1px solid var(--line)}
.in ul{margin:0 0 20px;padding-left:22px}
.in li{margin-bottom:12px;max-width:80ch}
.in li::marker{color:var(--pu)}
.in p{margin:0;color:#e6e2f3;max-width:80ch}
.hint{color:var(--mut);margin:0 0 26px;font-size:15px}
@media(max-width:980px){.hero{grid-template-columns:1fr;gap:34px}.pw{max-width:380px}.stats,.soft{grid-template-columns:1fr 1fr}.sg-grid{grid-template-columns:1fr 1fr}.ex,.ac,.cl{grid-template-columns:1fr}.pj{grid-template-columns:1fr}.logo span{display:none}}
@media(max-width:560px){.sg-grid,.soft{grid-template-columns:1fr}.ed{grid-template-columns:1fr;gap:14px}.ed img{max-height:80px;width:auto}.fc{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
